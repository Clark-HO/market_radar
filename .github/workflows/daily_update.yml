name: 每日股市資料更新 (Daily Stock ETL)

on:
  schedule:
    # GitHub Actions uses UTC time. Taiwan is UTC+8.
    # 08:00 UTC = 16:00 Taiwan (Market close data)
    - cron: '0 8 * * 1-5'  # Runs Mon-Fri at 16:00 Taiwan time
  workflow_dispatch:

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements-data.txt

      - name: Run Stock ETL
        id: stock_etl
        continue-on-error: true
        run: |
          echo "Starting Stock ETL..."
          python backend/data_updater.py --force

      - name: Run Macro ETL
        id: macro_etl
        continue-on-error: true
        run: |
          echo "Starting Macro ETL..."
          python backend/scrapers/macro.py

      - name: Update Event Calendar (Weekly)
        id: event_scraper
        continue-on-error: true
        run: |
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Starting Event Scraper..."
            python backend/event_scraper.py
          else
            echo "Skipping event scraper (only runs on Mondays)."
          fi

      - name: Run Global Intelligence ETL
        id: global_etl
        continue-on-error: true
        run: |
          echo "Starting Global Intelligence ETL..."
          python backend/global_updater.py

      - name: Check ETL Results
        run: |
          echo "Stock ETL: ${{ steps.stock_etl.outcome }}"
          echo "Macro ETL: ${{ steps.macro_etl.outcome }}"
          echo "Event Scraper: ${{ steps.event_scraper.outcome }}"
          echo "Global ETL: ${{ steps.global_etl.outcome }}"
          if [ "${{ steps.stock_etl.outcome }}" = "failure" ] && [ "${{ steps.macro_etl.outcome }}" = "failure" ] && [ "${{ steps.global_etl.outcome }}" = "failure" ]; then
            echo "❌ All ETL steps failed!"
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Stock Bot"
          git config --global user.email "actions@github.com"
          
          # Add all generated JSON files
          git add frontend/public/stock_data.json frontend/public/macro_data.json frontend/public/global_data.json
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📈 Auto-update stock data [$(date +'%Y-%m-%d')]"
            git pull --rebase -Xtheirs origin main
            git push origin main
          fi
